name: worm_tap_habituation
dataset: worm_cook2019
model: graded
params: {std: {u: 0.08, tau_rec_ms: 480}}
seed: 0
duration_ms: 12000
window_ms: 50
stimulus:
  noise: 0.0
  pulses:
    - {names: [PLML, PLMR], value: 1.0, t0_ms: 500, t1_ms: 700}
    - {names: [PLML, PLMR], value: 1.0, t0_ms: 1500, t1_ms: 1700}
    - {names: [PLML, PLMR], value: 1.0, t0_ms: 2500, t1_ms: 2700}
    - {names: [PLML, PLMR], value: 1.0, t0_ms: 3500, t1_ms: 3700}
    - {names: [PLML, PLMR], value: 1.0, t0_ms: 4500, t1_ms: 4700}
    - {names: [PLML, PLMR], value: 1.0, t0_ms: 5500, t1_ms: 5700}
    - {names: [PLML, PLMR], value: 1.0, t0_ms: 6500, t1_ms: 6700}
    - {names: [PLML, PLMR], value: 1.0, t0_ms: 7500, t1_ms: 7700}
    - {names: [PLML, PLMR], value: 1.0, t0_ms: 8500, t1_ms: 8700}
    - {names: [PLML, PLMR], value: 1.0, t0_ms: 9500, t1_ms: 9700}
    - {names: [ALML, ALMR], value: 1.0, t0_ms: 10500, t1_ms: 10700}
valence:
  metric: ratio
  group: backward_cmd
  first: [550, 700]
  last: [9550, 9700]
  novel: [10550, 10700]
  novel_group: backward_cmd
  reward_if_below: 0.8
  pain_if_above: 1.0
extreme: false
notes: >
  Tap habituation (Rankin 1990): a repeated posterior stimulus gives a progressively smaller
  response, a novel stimulus restores the response. Synaptic depression is an assumption, taken
  from flybrain. Measuring on backward_cmd is a false premise: in this dataset (Cook 2019), PLM
  has no chemical output at all, only gap junctions onto PVC (and PLN/PDE/PHC/LUA/hyp), and gap
  junctions do not depress in the model. So the measurement on backward_cmd, as expected, will
  NOT show habituation until this model assumption is changed (e.g. gap-junction depression) or
  the data itself is. Left as a recorded assumption rather than retroactively fixed.
