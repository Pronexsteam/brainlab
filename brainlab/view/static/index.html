<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BrainLab</title>
<style>
 body{margin:0;background:#111;color:#ddd;font:14px system-ui}
 #bar{padding:8px;display:flex;gap:12px;align-items:center;background:#1a1a1a}
 #bar select,#bar button,#bar input{font:inherit}
 #status{color:#9cf}
 canvas{display:block}
 #info{position:fixed;right:8px;top:48px;background:#1a1a1aee;padding:8px;max-width:320px;white-space:pre-wrap}
 #state{position:fixed;right:8px;bottom:8px;background:#1a1a1aee;border:1px solid #333}
</style></head>
<body>
<div id="bar">
 <label>dataset <select id="dataset"></select></label>
 <label>group <select id="group"></select></label>
 <label>color <select id="color"><option value="class">class</option><option value="transmitter">transmitter</option></select></label>
 <label>run <select id="run"><option value="">—</option></select></label>
 <button id="play">▶</button>
 <input id="time" type="range" min="0" max="0" value="0" style="width:240px">
 <span id="status">loading</span>
</div>
<canvas id="c"></canvas>
<div id="info"></div>
<canvas id="state" width="300" height="120"></canvas>
<script src="app.js"></script>
</body></html>
