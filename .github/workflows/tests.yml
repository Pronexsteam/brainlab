name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pandas pyarrow pyyaml networkx pytest playwright
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m playwright install --with-deps chromium
      - name: Fetch and load the worm connectome (small, public)
        run: |
          python -m brainlab.store.fetch worm
          python -m brainlab.store.loaders.worm_cook2019
      # The fly datasets (~30 GB) and the GPU gates are not run here; see README "Reproduce the numbers".
      # test_gate1 and test_habituation_experiment are the documented scientific reds (worm), deselected in CI.
      - name: Fast tests
        run: |
          python -m pytest -q tests -m "not slow" \
            --deselect tests/test_gate2.py::test_gate2_passes \
            --deselect tests/test_gate1.py::test_gate1_touch_asymmetry \
            --deselect tests/test_runner.py::test_habituation_experiment
